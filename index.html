<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Piano</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="piano">

  <!-- WHITE KEYS -->
  <div class="white-keys">
    <div class="key white" data-note="C">C</div>
    <div class="key white" data-note="D">D</div>
    <div class="key white" data-note="E">E</div>
    <div class="key white" data-note="F">F</div>
    <div class="key white" data-note="G">G</div>
    <div class="key white" data-note="A">A</div>
    <div class="key white" data-note="B">B</div>
    <div class="key white" data-note="C">C</div>
    <div class="key white" data-note="D">D</div>
    <div class="key white" data-note="E">E</div>
    <div class="key white" data-note="F">F</div>
    <div class="key white" data-note="G">G</div>
    <div class="key white" data-note="A">A</div>
    <div class="key white" data-note="B">B</div>
  </div>

  <!-- BLACK KEYS -->
  <div class="black-keys">
    <div class="key black csharp" data-note="C#">C#<br>Db</div>
    <div class="key black dsharp" data-note="D#">D#<br>Eb</div>
    <div class="key black fsharp" data-note="F#">F#<br>Gb</div>
    <div class="key black gsharp" data-note="G#">G#<br>Ab</div>
    <div class="key black asharp" data-note="A#">A#<br>Bb</div>
    <div class="key black ccsharp" data-note="Cc">C#<br>Db</div>
    <div class="key black ddsharp" data-note="Dd">D#<br>Eb</div>
    <div class="key black ffsharp" data-note="Ff">F#<br>Gb</div>
    <div class="key black ggsharp" data-note="Gg">G#<br>Ab</div>
    <div class="key black aasharp" data-note="Aa">A#<br>Bb</div>
    
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
